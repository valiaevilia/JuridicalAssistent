# В репозитории ранее был только openapi.yaml: это контракт HTTP API.
# Настройки L отделены от него. Секреты и имена моделей получает клиент B.
role_l:
  prompt_version: L-1.0
  s8_enabled: true
  max_repairs: 1
  json_retries: 1
  max_llm_calls: 5
  answer_hard_limit: 9500
  max_input_chars: 60000
  max_context_chars: 24000
  max_tokens: 2500
  max_tokens_ceiling: 5000
  temperature: 0.0
  llm_timeout: 60.0
  q_budget_sec: 120.0
  s8_min_remaining_sec: 8.0
